<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do List (localStorage)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>To‑Do List</h1>

    <form id="todo-form" class="todo-form" aria-label="Ajouter une tâche">
      <input id="todo-input" type="text" placeholder="Ajouter une tâche..." aria-label="Nouvelle tâche" />
      <button type="submit">Ajouter</button>
    </form>

    <div class="controls">
      <div class="filters" role="tablist" aria-label="Filtres">
        <button class="filter active" data-filter="all" role="tab">Toutes</button>
        <button class="filter" data-filter="active" role="tab">Actives</button>
        <button class="filter" data-filter="completed" role="tab">Terminées</button>
      </div>
      <div class="actions">
        <button id="clear-completed">Supprimer terminées</button>
        <button id="toggle-all">Tout cocher/décocher</button>
      </div>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="count"></span>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
